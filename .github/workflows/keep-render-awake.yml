name: Keep Render service awake

on:
  push:
    branches: [main]
    paths: [.github/workflows/keep-render-awake.yml]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 "https://tiktok-data.tuli7.com/api/health?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > /dev/null
